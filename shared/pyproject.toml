[project]
name = "deliverome-blog-utils"
version = "0.1.0"
description = "Shared plotting, figure-provenance and data-fetching helpers for Deliverome blog posts"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.9",
    "pandas>=2.2",
    "seaborn>=0.13.2",
]

[project.scripts]
blog-data = "deliverome_blog_utils.data:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deliverome_blog_utils"]
