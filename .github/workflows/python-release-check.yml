# Monthly reminder to consider a newer stable Python (Deliverome-Project/.github). Keeps one
# open "Python upgrade: ..." issue here while this repo targets an older Python than the newest
# cycle that is at least 90 days old.
name: python-release-check

on:
  schedule:
    - cron: "0 14 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  python-release:
    if: github.repository == 'Deliverome-Project/deliverome-blog'  # not in the private drafts copy
    uses: Deliverome-Project/.github/.github/workflows/python-release-check.yml@69e2920b028988cf821403c9cda01fb60444d4b7
