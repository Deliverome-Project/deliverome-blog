# Shared Deliverome dependency guard (Deliverome-Project/.github): fails a PR that silently
# downgrades a package, newly locks a version under 7 days old, keeps a version below a
# security floor, or drifts from the org's Python/uv standard. Deliberate exceptions go in
# the PR description:
#   allow-downgrade: <name>
#   allow-fresh: <name>
name: dependency-guard

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]  # edited: re-check after an allow line

permissions:
  contents: read

jobs:
  guard:
    uses: Deliverome-Project/.github/.github/workflows/dependency-guard.yml@69e2920b028988cf821403c9cda01fb60444d4b7 # v1
