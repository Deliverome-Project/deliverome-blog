# Keeps the private drafts repo (Deliverome-Project/deliverome-blog-drafts) up to date with
# this public repo, the way a fork would be. It lives here so both repos carry the identical
# file, and it runs only in the drafts repo. Nightly, or on demand from the Actions tab:
# merges public main into drafts main. The README post index is the one file both sides
# regenerate, so a conflict there is resolved by rebuilding it.
#
# Two cases need a person, and the run fails with the fix in its error annotation (GitHub
# emails failed scheduled runs): any other merge conflict, and a public change to
# .github/workflows/, which GitHub never lets the Actions token push. Either way, from a
# local drafts checkout: `git pull upstream main && git push` (resolve conflicts first).
name: sync-from-public

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.repository == 'Deliverome-Project/deliverome-blog-drafts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Merge public main
        run: |
          fix="From a local drafts checkout run: git pull upstream main && git push"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Deliverome-Project/deliverome-blog.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with public main."; exit 0
          fi
          if ! git merge --no-edit upstream/main -m "Sync from public main"; then
            conflicts=$(git diff --name-only --diff-filter=U | tr '\n' ' ')
            if [ "$conflicts" = "README.md " ]; then
              git checkout --theirs README.md
              uv run scripts/build_index.py
              git add README.md
              git commit --no-edit
            else
              git merge --abort
              echo "::error::Merge conflicts in: $conflicts. $fix, resolving the conflicts before pushing."
              exit 1
            fi
          fi
          if ! git diff --quiet origin/main HEAD -- .github/workflows; then
            echo "::error::Public main changed .github/workflows/, which the Actions token may not push. $fix"
            exit 1
          fi
          git push origin HEAD:main
