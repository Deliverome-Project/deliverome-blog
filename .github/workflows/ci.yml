name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  structure:
    name: Post structure and index
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run scripts/build_index.py --check

  figures:
    name: Figure scripts and shared tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Shared tooling tests
        run: uv run --locked pytest -q
        working-directory: shared
      - name: Figure rules (standalone, style in sync, PNG made by current script)
        run: uv run --locked --project shared blog-figure check
